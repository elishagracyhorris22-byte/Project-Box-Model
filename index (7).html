<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .con{
            height: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        h1{
            margin-top: 20px;
        }
        .box{
            border: 1px solid black;
            height: 500px;
            width: 800px;
            background-color: hsl(184, 100%, 55%);
            display: flex;
            justify-content: center;
            align-items: center;
            margin: auto;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
        .box1{
            border: 1px solid black;
            height: 400px;
            width: 700px;
            color:white;
            background-color: lch(42.29% 34.37 258.45 / 0.979);
        }
        .box2{
            border: 20px solid #060155;
            height: 300px;
            width: 600px;
            margin: 50px 50px 50px 50px;
            padding: 30px 30px 30px 30px;
            background-color:  lab(23.53% 43.76 -70.1);
            text-align: center;
        }
        .box3{
            border: 1px solid black;
            height: 190px;
            width: 450px;   
            background-color: #29a7c7;
            margin-left: 25px;
            text-align: center;
            line-height: 195px;
            color: white;
        }
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
        }
        .margin{
            position: absolute;
            top: 170px;
            left: 0;
            width: 100%;
            text-align: center;
        }

        .padding{
            position: absolute;
            top: 235px;
            left: 0;
            width: 100%;
            text-align: center;
            color: white;
        }

        .border{
            position: absolute;
            top: 210px;
            left: 0;
            width: 100%;
            text-align: center;
            color: white;
        }
    </style>
</head>
<body>
    <h1 align="center">Box Plotting</h1>
    <div class="con">
        <div class="box">
            <div class="box1">
                <p class="margin">Margin</p>
                <div class="box2">
                    <p class="border">Border</p>
                    <p class="padding">Padding</p>         
                    <p><div class="box3">Content</p>
                    </div>    
                </div>
            </div>
        </div>
    </div>
</body>
</html>
